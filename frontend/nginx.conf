server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin as the app, so the browser needs no CORS and no API address.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Hashed file names, so built assets can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mqi
      POSTGRES_PASSWORD: mqi
      POSTGRES_DB: mqi
    # No host port: only the api talks to the database. A local Postgres on 5432 can't clash.
    # To poke at it: docker compose exec db psql -U mqi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqi -d mqi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mqi:mqi@db:5432/mqi
      DATA_DIR: /srv/data
    volumes:
      - ./data:/srv/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      # Override with WEB_PORT=... if 8080 is taken.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscheck-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    # Used only to cross-check the hand-written AUC in tests, never imported by the app.
    "scikit-learn>=1.5",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: loads the CSVs into the PostgreSQL at DATABASE_URL, dropping every table"]
addopts = "-m 'not integration'"
filterwarnings = [
    # Starlette wants httpx2 for TestClient; httpx still works and is what FastAPI documents.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

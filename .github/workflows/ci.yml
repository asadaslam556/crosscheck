name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mqi
          POSTGRES_PASSWORD: mqi
          POSTGRES_DB: mqi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mqi" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://mqi:mqi@localhost:5432/mqi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Integration tests against Postgres
        run: pytest -m integration
      - name: API types are up to date
        run: |
          python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../frontend/openapi.json
          cd ../frontend && npx --yes openapi-typescript@7 openapi.json -o src/lib/api-types.ts
          git diff --exit-code -- src/lib/api-types.ts
      - name: Release gate
        # The gate warns on the v1 to v2 release by design; the report goes into the run summary.
        run: python -m app.gate >> "$GITHUB_STEP_SUMMARY"
      - name: Export the static snapshot
        run: python -m scripts.export_snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: frontend/public/data

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: frontend/public/data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:static
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait
      - name: Smoke test through nginx
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent --output /dev/null http://localhost:8080/
      - if: always()
        run: docker compose logs api
